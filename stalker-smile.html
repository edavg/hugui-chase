<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mondyi · La sonrisa inmóvil</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #111311; color: #e5e1d5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 100dvh; }
    #stage { position: relative; min-height: 75dvh; }
    canvas { display: block; width: 100%; height: 100%; }
    header { position: absolute; z-index: 1; top: 28px; left: 28px; pointer-events: none; }
    .eyebrow { color: #969d8b; font-size: 11px; letter-spacing: .18em; }
    h1 { font-size: clamp(19px, 2vw, 29px); font-weight: 500; letter-spacing: -.05em; margin: 9px 0; }
    #status { position: absolute; bottom: 24px; left: 28px; right: 28px; color: #adb09d; font-size: 11px; line-height: 1.7; }
    aside { border-left: 1px solid #30352b; padding: 28px 22px; display: flex; flex-direction: column; gap: 22px; }
    h2 { margin: 0 0 12px; font-size: 11px; font-weight: 400; letter-spacing: .12em; color: #adb09d; text-transform: uppercase; }
    #clips { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    button, a.download { border: 1px solid #444a3c; background: #1c201a; color: inherit; padding: 10px 12px; font: inherit; font-size: 11px; cursor: pointer; border-radius: 3px; }
    button:hover, button[aria-pressed="true"] { background: #35402b; border-color: #899b6c; }
    button:disabled { opacity: .4; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 2px solid #b7ca90; outline-offset: 3px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 11px; }
    input { accent-color: #a8bd86; }
    #speed { width: 120px; }
    #export { width: 100%; background: #adb890; color: #11180c; border-color: #adb890; }
    #reference { width: 100%; max-height: 300px; object-fit: contain; background: #99938d; }
    .hint { font-size: 10px; line-height: 1.8; color: #929985; }
    .bottom { margin-top: auto; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } #stage { height: 72dvh; } aside { border-left: 0; border-top: 1px solid #30352b; } #reference { max-height: 220px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <section id="stage" aria-label="Vista 3D del stalker">
      <header><div class="eyebrow">MONDYI / STALKER</div><h1>La sonrisa inmóvil</h1></header>
      <canvas id="view" aria-label="Modelo 3D; arrastra para girar y usa la rueda para acercarte"></canvas>
      <div id="status" role="status">Cargando el nuevo stalker…</div>
    </section>
    <aside>
      <section><h2>Movimiento</h2><div id="clips"></div><label>Velocidad <input id="speed" type="range" min="0.3" max="1.8" step="0.05" value="1" /></label><label>Pose <input id="pose" type="range" min="0" max="1" step="0.001" value="0" /></label></section>
      <section><h2>Vista</h2><label>Pausa <input id="paused" type="checkbox" /></label><label>Giro automático <input id="rotate" type="checkbox" /></label><label>Acabado PSX <input id="retro" type="checkbox" checked /></label><button id="front">Cuerpo completo</button> <button id="face">Ver la cara</button></section>
      <section><h2>Concepto</h2><img id="reference" src="/assets/models/stalker/genex-smile/concept.png" alt="Concepto del stalker con el rostro del afiche y un cuerpo pesado y asimétrico" /></section>
      <section class="bottom"><button id="export" disabled>Descargar GLB completo</button><p class="hint">Arrastra para girar · rueda para acercarte.<br />La cara usa la textura original del juego.</p></section>
    </aside>
  </main>
  <script type="module" src="/src/dev/stalkerSmilePreview.ts"></script>
</body>
</html>
