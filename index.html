<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mondyi</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0e'/%3E%3Crect x='3' y='6' width='10' height='2' fill='%23a33a2e'/%3E%3Crect x='6' y='4' width='4' height='2' fill='%23cfc7ae'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #ui {
        display: block;
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <canvas id="ui" width="640" height="480"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
