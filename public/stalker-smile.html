<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mondyi · La sonrisa inmóvil</title>
  <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;color:#e5e1d5;background:#111311;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0}main{grid-template-columns:minmax(0,1fr) 300px;min-height:100dvh;display:grid}#stage{min-height:75dvh;position:relative}canvas{width:100%;height:100%;display:block}header{z-index:1;pointer-events:none;position:absolute;top:28px;left:28px}.eyebrow{color:#969d8b;letter-spacing:.18em;font-size:11px}h1{letter-spacing:-.05em;margin:9px 0;font-size:clamp(19px,2vw,29px);font-weight:500}#status{color:#adb09d;font-size:11px;line-height:1.7;position:absolute;bottom:24px;left:28px;right:28px}aside{border-left:1px solid #30352b;flex-direction:column;gap:22px;padding:28px 22px;display:flex}h2{letter-spacing:.12em;color:#adb09d;text-transform:uppercase;margin:0 0 12px;font-size:11px;font-weight:400}#clips{grid-template-columns:1fr 1fr;gap:7px;display:grid}button,a.download{color:inherit;font:inherit;cursor:pointer;background:#1c201a;border:1px solid #444a3c;border-radius:3px;padding:10px 12px;font-size:11px}button:hover,button[aria-pressed=true]{background:#35402b;border-color:#899b6c}button:disabled{opacity:.4;cursor:wait}button:focus-visible,input:focus-visible{outline-offset:3px;outline:2px solid #b7ca90}label{justify-content:space-between;align-items:center;margin:12px 0;font-size:11px;display:flex}input{accent-color:#a8bd86}#speed{width:120px}#export{color:#11180c;background:#adb890;border-color:#adb890;width:100%}#reference{object-fit:contain;background:#99938d;width:100%;max-height:300px}.hint{color:#929985;font-size:10px;line-height:1.8}.bottom{margin-top:auto}@media (max-width:700px){main{grid-template-columns:1fr}#stage{height:72dvh}aside{border-top:1px solid #30352b;border-left:0}#reference{max-height:220px}}@media (prefers-reduced-motion:reduce){*,:before,:after{scroll-behavior:auto!important}}</style>
  <script type="module" crossorigin src="./assets/models/stalker/genex-smile/preview-bundle/stalker-smile-bfrqpBTL.js"></script>
</head>
<body>
  <main>
    <section id="stage" aria-label="Vista 3D del stalker">
      <header><div class="eyebrow">MONDYI / STALKER</div><h1>La sonrisa inmóvil</h1></header>
      <canvas id="view" aria-label="Modelo 3D; arrastra para girar y usa la rueda para acercarte"></canvas>
      <div id="status" role="status">Cargando el nuevo stalker…</div>

      <section><h2>Movimiento</h2><div id="clips"></div><label>Velocidad <input id="speed" type="range" min="0.3" max="1.8" step="0.05" value="1" /></label><label>Pose <input id="pose" type="range" min="0" max="1" step="0.001" value="0" /></label></section>
      <section><h2>Vista</h2><label>Pausa <input id="paused" type="checkbox" /></label><label>Giro automático <input id="rotate" type="checkbox" /></label><label>Acabado PSX <input id="retro" type="checkbox" checked /></label><button id="front">Cuerpo completo</button> <button id="face">Ver la cara</button></section>
      <section><h2>Concepto</h2><img id="reference" src="/assets/models/stalker/genex-smile/concept.png" alt="Concepto del stalker con el rostro del afiche y un cuerpo pesado y asimétrico" /></section>
      <section class="bottom"><button id="export" disabled>Descargar GLB completo</button><p class="hint">Arrastra para girar · rueda para acercarte.<br />La cara usa la textura original del juego.</p></section>
    </aside>
  </main>
</body>
